name: CV World Job Sync and Push

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check sources without writing jobs or sending notifications"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      send_test_notification:
        description: "Send a one-time notification check to all OneSignal subscribers"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: cvworld-job-sync
  cancel-in-progress: false

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: job-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: job-sync/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Sync official job boards to Firestore and notify subscribers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: "01a6beb2-665b-4684-b4f4-19c04c918706"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SEND_TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run sync
