name: CV World Growth Engine - Facebook

on:
  schedule:
    # Qatar is UTC+3. These run at 09:00 and 21:00 Asia/Qatar.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the post and image without publishing to Facebook"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      target_country:
        description: "Optional country code: qa, ae, sa, ma, dz, tn"
        required: false
        type: string
      post_language:
        description: "Optional language: ar or en"
        required: false
        type: string
      post_slot:
        description: "Optional slot: morning or evening"
        required: false
        type: string

jobs:
  facebook-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing/growth-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run growth engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          APP_DOWNLOAD_LINK: ${{ secrets.APP_DOWNLOAD_LINK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TARGET_COUNTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.target_country || '' }}
          POST_LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.post_language || '' }}
          POST_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.post_slot || '' }}
        run: npm run post

      - name: Upload generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvworld-growth-engine-output
          path: marketing/growth-engine/out/*.png
          if-no-files-found: ignore
